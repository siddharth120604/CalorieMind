version: "3.9"

services:
  db:
    image: postgres:16
    container_name: calorie_tracker_db
    env_file:              # ← Add this!
      - .env
    environment:           # These will override .env if needed (optional)
      POSTGRES_DB: ${POSTGRES_DB:-calorie_tracker}        # fallback value
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # POSTGRES_PASSWORD comes from .env → most secure
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-calorie_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: siddharth1206/caloriemind:latest
    container_name: calorie_tracker_migrate
    command: bash scripts/init_and_migrate.sh
    env_file:
      - .env               # ← Important!
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: siddharth1206/caloriemind:latest
    container_name: calorie_tracker_web
    command: gunicorn -w 2 -b 0.0.0.0:8080 main:app
    ports:
      - "8080:8080"
    env_file:
      - .env               # ← Important!
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: