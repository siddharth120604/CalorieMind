services:
  db:
    image: postgres:16
    container_name: calorie_tracker_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build: .
    container_name: calorie_tracker_migrate
    command: bash scripts/init_and_migrate.sh
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  localstack:
    image: localstack/localstack:3.0
    container_name: calorie_tracker_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
    restart: unless-stopped

  web:
    build: .
    container_name: calorie_tracker_web
    command: gunicorn -w 2 -b 0.0.0.0:8080 "backend.main:app"
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_PUBLIC_ENDPOINT_URL=http://localhost:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET_NAME=caloriemind-exports
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      localstack:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: calorie_tracker_frontend
    ports:
      - "3000:3000"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  localstack_data:
