name: Deploy Application

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/caloriemind:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/caloriemind:latest

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H caloriemind.duckdns.org >> ~/.ssh/known_hosts
          
      - name: Debug secrets on runner
        run: |
          echo "Checking secrets existence (not values)"
          echo "DOCKERHUB_USERNAME is set? -> ${{ secrets.DOCKERHUB_USERNAME != '' }}"
          echo "POSTGRES_USER is set? -> ${{ secrets.POSTGRES_USER != '' }}"
          echo "POSTGRES_DB is set? -> ${{ secrets.POSTGRES_DB != '' }}"
          echo "POSTGRES_PASSWORD is set? -> ${{ secrets.POSTGRES_PASSWORD != '' }}"

      - name: Copy project files to EC2
        run: |
          scp -o StrictHostKeyChecking=no -r \
            . \
            ${{ secrets.EC2_USER }}@caloriemind.duckdns.org:/home/ubuntu/caloriemind


      - name: Deploy on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@caloriemind.duckdns.org << 'EOF'
            set -e
            mkdir -p /home/ubuntu/caloriemind
            cd /home/ubuntu/caloriemind

            # Always rebuild .env from scratch
            rm -f .env

            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
            echo "GROQ_MODEL=${{ secrets.GROQ_MODEL }}" >> .env
            echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env
            echo "DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB }}" >> .env
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
            echo "AWS_DEFAULT_REGION=us-east-1" >> .env

            # AWS credentials for S3 restore
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
            echo "AWS_DEFAULT_REGION=us-east-1" >> .env

            ls -lh .env
            sed 's/=.*/=***REDACTED***/' .env

            sudo docker-compose down -v
            sudo docker-compose pull
            sudo docker-compose up -d
            sudo docker-compose ps
          EOF


      - name: Deployment success
        run: echo "🚀 App deployed successfully"
