name: Deploy Application

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/caloriemind:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/caloriemind:latest

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H caloriemind.duckdns.org >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@caloriemind.duckdns.org << 'EOF'
            set -e
            mkdir -p /home/ubuntu/caloriemind
            cd /home/ubuntu/caloriemind

            # === Create .env the safe way ===
            printf '%s\n' \
              "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" \
              "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" \
              "GROQ_MODEL=${{ secrets.GROQ_MODEL }}" \
              "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" \
              "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" \
              "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" \
              "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" \
              "DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB }}" \

              > .env

            # Debug: show what was really written (secrets masked)
            echo "===== .env content (secrets masked) ====="
            sed 's/=.*/=***REDACTED***/' .env
            echo "======================================="

            docker-compose pull
            docker-compose down
            docker-compose up -d
            docker-compose ps
          EOF

      - name: Deployment success
        run: echo "🚀 App deployed successfully"
