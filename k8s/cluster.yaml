# kind multi-node cluster config
# 2 nodes: control-plane (runs K8s API + workloads) + worker (workloads only)
# K8s scheduler spreads pods across both nodes automatically
# If worker node goes down, pods reschedule to control-plane
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  # Node 1 — control-plane + worker
  # Runs the K8s API server, scheduler, etcd AND also accepts pods
  # Port mappings let Ingress be accessible at http://localhost
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # Node 2 — worker only
  # Just runs pods. No K8s control plane components.
  # This simulates a second server in your cluster.
  - role: worker
