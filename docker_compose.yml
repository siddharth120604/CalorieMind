version: "3.9"

services:
  db:
    image: postgres:16
    container_name: calorie_tracker_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: ${DOCKERHUB_USERNAME}/caloriemind:latest
    container_name: calorie_tracker_migrate
    command: bash scripts/init_and_migrate.sh
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: ${DOCKERHUB_USERNAME}/caloriemind:latest
    container_name: calorie_tracker_web
    command: gunicorn -w 2 -b 0.0.0.0:8080 main:app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
